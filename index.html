<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iOS ignores the web manifest's icons entirely and reads this tag. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2FAE73" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sprout" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Sprout</title>
    <meta
      name="description"
      content="Kids earn points for real-world tasks, parents approve with a photo, and the points grow a garden and fill a saving jar."
    />
    <!-- Shared into a family WhatsApp group more often than it is typed in. -->
    <meta property="og:title" content="Sprout" />
    <meta
      property="og:description"
      content="Kids earn points for real-world tasks, parents approve with a photo, and the points grow a garden and fill a saving jar."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
